name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege for a public repository: jobs only read the checkout.
# The vcpkg GitHub Actions binary cache authenticates with
# ACTIONS_RUNTIME_TOKEN, which needs no extra GITHUB_TOKEN scope.
permissions:
  contents: read

# Cancel superseded runs of the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Hygiene checks
        run: bash tools/ci/hygiene.sh

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install clang-format
        run: python3 -m pip install --user "clang-format==18.1.8"

      - name: Check formatting
        run: |
          find src apps tests -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.inl' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror --style=file

  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [debug, release]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config autoconf autoconf-archive automake libtool \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev

      - name: Setup compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang lld
          fi

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset linux-${{ matrix.compiler }}-${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset linux-${{ matrix.compiler }}-${{ matrix.build_type }}

      - name: Test
        run: ctest --preset linux-${{ matrix.compiler }}-${{ matrix.build_type }}

      # Cross-platform determinism: the GCC Release build publishes the physics
      # state hash that the `determinism` job compares against Windows.
      - name: Determinism probe
        if: matrix.build_type == 'release' && matrix.compiler == 'gcc'
        run: ./build/linux-gcc-release/bin/sim_determinism | tee statehash.txt

      - name: Upload determinism hash
        if: matrix.build_type == 'release' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: statehash-linux
          path: statehash.txt

      # Dependency licence report (auditable before a release).
      - name: Dependency licence report
        if: matrix.build_type == 'release' && matrix.compiler == 'gcc'
        run: bash tools/ci/dependency_licenses.sh build/linux-gcc-release/vcpkg_installed

      - name: Upload dependency licence report
        if: matrix.build_type == 'release' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: dependency-licenses.txt

  windows:
    name: Windows MSVC ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset windows-msvc-${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset windows-msvc-${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build/windows-msvc-${{ matrix.build_type }} --output-on-failure

      # Cross-platform determinism: publish the physics state hash that the
      # `determinism` job compares against Linux.
      - name: Determinism probe (Release)
        if: matrix.build_type == 'release'
        shell: pwsh
        run: |
          & "build/windows-msvc-release/bin/sim_determinism.exe" | Tee-Object -FilePath statehash.txt

      - name: Upload determinism hash
        if: matrix.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: statehash-windows
          path: statehash.txt

  determinism:
    name: Cross-platform determinism
    runs-on: ubuntu-latest
    needs: [linux, windows]
    steps:
      - name: Download state hashes
        uses: actions/download-artifact@v4
        with:
          pattern: statehash-*
          path: hashes

      - name: Compare Windows and Linux hashes
        run: |
          set -euo pipefail
          cat hashes/statehash-linux/statehash.txt hashes/statehash-windows/statehash.txt
          if ! diff -u hashes/statehash-linux/statehash.txt hashes/statehash-windows/statehash.txt; then
            echo "::error::physics state hash differs between Windows and Linux"
            exit 1
          fi
          echo "Windows and Linux physics state hashes match."

  gpu-linux:
    name: Linux headless GPU (lavapipe)
    runs-on: ubuntu-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config autoconf autoconf-archive automake libtool \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libasound2-dev libpulse-dev \
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake --preset linux-gcc-release \
            -DSIM_ENABLE_GPU_TESTS=ON \
            -DSIM_VULKAN_ICD=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json

      - name: Build
        run: cmake --build --preset linux-gcc-release

      - name: Generate golden candidates if missing
        run: |
          if [ ! -f screenshots/golden_candidates/grid.png ]; then
            echo "no approved golden references; generating candidates for human review..."
            cmake --build --preset linux-gcc-release --target update_golden
          else
            echo "golden candidates found; keeping them for the run"
          fi
        shell: bash

      - name: Headless GPU tests
        run: ctest --test-dir build/linux-gcc-release -L gpu --output-on-failure

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-screenshots
          path: build/linux-gcc-release/screenshots/*.png
          if-no-files-found: warn

      - name: Upload golden candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-candidates
          path: screenshots/golden_candidates/*.png
          if-no-files-found: warn
