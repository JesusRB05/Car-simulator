# Sunset Circuit - base track descriptor (CC BY-SA 4.0).
#
# Loaded at start-up by TrackLoader through the VFS and turned into a
# drive::Track: a closed centripetal Catmull-Rom spline through the control
# points below, resampled by arc length over a few smooth Gaussian hills. The
# values reproduce drive::defaultTrackDescription() exactly, so the base circuit
# is unchanged. All values are SI: metres and seconds.

id = "sunset_circuit"
name = "Sunset Circuit"
author = "Car Simulator contributors"
license = "CC BY-SA 4.0"
location = "Procedural test loop"
description = "The base test circuit: a long straight, a right hairpin, a fast sweeper and a chicane draped over a rolling terrain of a few smooth hills. Width and banking change along the lap."

[geometry]
loop = true
sample_spacing = 1.0        # metres between resampled centreline points
half_width = 5.0            # asphalt half-width (metres, each side)
kerb_width = 1.0            # kerb band beyond the asphalt (metres)
start_z = 40.0              # z of the start/finish line (metres)

# Centreline control points in the direction of travel (metres). Right-handed
# world: +X right, +Y up, -Z forward; the car starts on the straight at x = 0
# heading -Z.
control_points = [
    [0.0, 120.0],    # main straight
    [0.0, 20.0],     # start/finish line around z = 40
    [0.0, -90.0],    # end of the straight, braking zone
    [6.0, -165.0],   # hairpin entry (right)
    [28.0, -192.0],  # hairpin apex
    [52.0, -170.0],  # hairpin exit
    [55.0, -95.0],   # back straight over the hill
    [105.0, -25.0],  # fast sweeper
    [122.0, 55.0],   # sweeper exit
    [98.0, 100.0],   # chicane (left)
    [124.0, 128.0],  # chicane (right)
    [96.0, 160.0],   # chicane exit
    [48.0, 196.0],   # long left onto the main straight
    [8.0, 168.0],
]

# A handful of smooth Gaussian hills give the circuit gentle elevation changes
# (max grade ~6 % each) without ever becoming a hill climb. h = height *
# exp(-d^2 / (2 sigma^2)).
[[terrain.hills]]
x = 90.0                     # under the back straight / sweeper
z = -60.0
height = 5.0
sigma = 55.0

[[terrain.hills]]
x = 30.0                     # around the hairpin
z = -176.0
height = 3.2
sigma = 40.0

[[terrain.hills]]
x = 112.0                    # under the chicane
z = 116.0
height = 2.8
sigma = 44.0

[[terrain.hills]]
x = -40.0                    # beside the main straight
z = 150.0
height = 2.2
sigma = 55.0
